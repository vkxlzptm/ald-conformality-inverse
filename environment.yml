# conda env create -f environment.yml
# conda activate pinn
name: pinn
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - numba>=0.60          # numpy 2.x 호환. 낮으면 Int64DType 에러가 난다
  - matplotlib
  - scipy
  - tqdm
  - pytorch          # CPU/MPS. Apple Silicon 은 conda-forge 빌드로 MPS 가 붙는다
